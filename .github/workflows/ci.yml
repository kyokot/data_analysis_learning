name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型検査
        run: npm run typecheck
      - name: コンテンツの検証
        run: npm run validate:content
      - name: テスト
        run: npm test
      - name: ビルド
        run: npm run build
